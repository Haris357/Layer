[package]
name = "layer"
version = "1.9.0"
description = "A quiet layer on your desktop"
authors = ["Layer"]
edition = "2021"

[lib]
name = "layer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.33"
image = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_Graphics_Gdi",
] }
windows = { version = "0.59", features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Geolocation",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "ApplicationModel",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Performance",
] }
png = "0.17"
base64 = "0.22"

[profile.release]
codegen-units = 16
lto = false
opt-level = 2
strip = true

# Keep the dev build (`tauri dev`) from ballooning to 10–15 GB. The bulk of
# target/ is debug symbols (huge .pdb files on Windows). We don't attach a
# Rust debugger here, so drop them — the app builds and runs identically, just
# with less detailed panic backtraces. This typically cuts the dev target by
# more than half.
[profile.dev]
debug = false
# Dependencies are most of the compiled code and never need debug info.
[profile.dev.package."*"]
debug = false
