name: Check

# Fast checks on every push and pull request: type-check and the regex
# safety check (a catastrophically backtracking regex once froze the app).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Regex safety (ReDoS)
        run: npm run check:regex

      # Every t('key') used in code must exist in the locales, and no two
      # widgets may share a toolbar icon.
      - name: Translation keys + unique widget icons
        run: npm run check:i18n && npm run check:icons
