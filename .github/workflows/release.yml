name: Release

# Push a version tag to build the installers and publish them to the public
# Layer-releases repo, where the app's auto-updater picks them up.
#   npm version patch   (or: edit versions, then `git tag v1.2.0`)
#   git push --follow-tags

on:
  push:
    tags:
      - 'v*'

jobs:
  # Native ARM64 build on an ARM Windows runner. Allowed to fail: if the runner
  # is unavailable or the build breaks, the x64 release below still ships (it
  # just won't include the ARM64 artifact this time).
  build-arm64:
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: arm64

      - name: Install dependencies
        run: npm ci

      - name: Build Layer (signed, ARM64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Upload ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: arm64-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe*
          if-no-files-found: error

  release:
    needs: build-arm64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Strip the instructional HTML comment from RELEASE_NOTES.md and reuse
      # the cleaned text everywhere: GitHub release body, in-app updater notes,
      # and the announcement email.
      - name: Prepare release notes
        id: notes
        shell: pwsh
        run: |
          $raw = ''
          if (Test-Path RELEASE_NOTES.md) { $raw = Get-Content RELEASE_NOTES.md -Raw }
          $clean = ([regex]::Replace($raw, '(?s)<!--.*?-->', '')).Trim()
          if (-not $clean) {
            $clean = "Layer ${{ github.ref_name }} — install or let the app auto-update."
          }
          Set-Content -Path notes.md -Value $clean -Encoding utf8
          "RELEASE_NOTES<<NOTES_EOF" | Add-Content $env:GITHUB_ENV
          $clean                     | Add-Content $env:GITHUB_ENV
          "NOTES_EOF"                | Add-Content $env:GITHUB_ENV
          # Release notes can opt out of the subscriber email with a
          # <!-- skip-email --> marker (handy for small patch releases).
          $announce = if ($raw -match '(?i)skip-email') { 'false' } else { 'true' }
          "announce=$announce" | Add-Content $env:GITHUB_OUTPUT

      - name: Build Layer (signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # Pull the ARM64 installer from the build-arm64 job. Best effort — if that
      # job failed/was skipped, the release continues x64-only.
      - name: Download ARM64 installer
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: arm64-installer
          path: arm64-dist

      - name: Generate update manifest
        run: node scripts/make-latest-json.mjs ${{ github.ref_name }} arm64-dist

      - name: Publish release to Layer-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1
          # Stable-named copy so the website can always link to the latest build.
          Copy-Item $exe.FullName "Layer-Setup.exe"
          $assets = @(
            "$($exe.FullName)#Layer installer x64 (versioned)",
            "Layer-Setup.exe#Layer installer",
            "latest.json"
          )
          # Include the ARM64 installer if the ARM job produced one.
          $arm = Get-ChildItem arm64-dist/*-setup.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($arm) {
            Copy-Item $arm.FullName "Layer-Setup-arm64.exe"
            $assets += "$($arm.FullName)#Layer installer ARM64 (versioned)"
            $assets += "Layer-Setup-arm64.exe#Layer installer (ARM64)"
            Write-Host "Including ARM64 installer: $($arm.Name)"
          } else {
            Write-Host "No ARM64 installer this run — publishing x64 only."
          }
          gh release create ${{ github.ref_name }} @assets `
            --repo Haris357/Layer-releases `
            --title "Layer ${{ github.ref_name }}" `
            --notes-file notes.md

      # Prepend this release's notes to the "## Changelog" section of the
      # Layer-releases README so it stays current on every release. Best effort:
      # the release is already published, so a hiccup here doesn't fail it.
      - name: Update Layer-releases changelog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = (Get-Content notes.md -Raw) -replace "`r", ""
          $lines = $notes -split "`n"
          # Title = first "## ..." heading; body = the bullet lines.
          $title = (($lines | Where-Object { $_ -match '^\s*##\s+' } | Select-Object -First 1) -replace '^\s*##\s+', '').Trim()
          $bullets = ($lines | Where-Object { $_ -match '^\s*-\s+' }) -join "`n"
          $entry = "### $tag — $title`n$bullets`n"

          git clone "https://x-access-token:$env:GH_TOKEN@github.com/Haris357/Layer-releases.git" relrepo
          $readmePath = "relrepo/README.md"
          $readme = Get-Content $readmePath -Raw
          if ($readme -match [regex]::Escape("### $tag ")) {
            Write-Host "Changelog already has $tag — skipping."
          } else {
            $anchor = "## Changelog"
            if ($readme.Contains($anchor)) {
              # Literal replace (no regex) so titles with $ or emoji are safe.
              $readme = $readme.Replace($anchor, "$anchor`n`n$entry")
            } else {
              $readme = "$readme`n`n$anchor`n`n$entry"
            }
            Set-Content -Path $readmePath -Value $readme -Encoding utf8 -NoNewline
            Push-Location relrepo
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Changelog: Layer $tag"
            git push
            Pop-Location
            Write-Host "Changelog updated for $tag."
          }

      # Tell everyone on the download list about the new version. Best effort —
      # a mail hiccup won't mark the release failed (it's already published).
      - name: Install announcement deps
        if: steps.notes.outputs.announce != 'false'
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Announce release to subscribers
        if: steps.notes.outputs.announce != 'false'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/announce.mjs ${{ github.ref_name }} notes.md
